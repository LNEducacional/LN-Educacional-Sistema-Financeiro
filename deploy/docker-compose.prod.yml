name: fin-prod

services:
  # ============================================
  # PostgreSQL - Banco de dados principal
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: fin-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fin_prod_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # API - Backend Go (Chi)
  # ============================================
  api:
    image: ghcr.io/${GH_OWNER}/sistema-financeiro-api:${IMAGE_TAG:-latest}
    container_name: fin-prod-api
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64M
    environment:
      DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@fin-prod-postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://financeiro.lneducacional.com.br}
      APP_BASE_URL: ${APP_BASE_URL:-https://financeiro.lneducacional.com.br}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_SANDBOX: ${ASAAS_SANDBOX:-false}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
    volumes:
      - uploads_data:/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge_network
      - fin_prod_internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Client - Frontend React (servido por Nginx)
  # ============================================
  client:
    image: ghcr.io/${GH_OWNER}/sistema-financeiro-client:${IMAGE_TAG:-latest}
    container_name: fin-prod-client
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:size=64M
      - /var/cache/nginx:size=64M
      - /run:size=8M
    depends_on:
      - api
    networks:
      - edge_network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  edge_network:
    external: true
  fin_prod_internal:
    internal: true
